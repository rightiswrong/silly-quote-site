- name: React Project Checker
  # You may pin to the exact commit or the version.
  # uses: VictorDanilov/react-project-checker-action@3c1454ece249b31da81f04d29f2e5e6dba549d99
  uses: VictorDanilov/react-project-checker-action@v0.0.1-alpha

  - name: Tailwind Builder
  # You may pin to the exact commit or the version.
  # uses: ArnaudLigny/tailwind-builder@da6dfb30e651964d8e1e79ccef401b5e09b9dfd8
  uses: ArnaudLigny/tailwind-builder@1.2.1
  with:
    # Source CSS file path.
    input: # optional, default is assets/tailwind.css
    # Output CSS file path.
    output: # optional, default is 
    # Watch for file changes.
    watch: # optional, default is false
    # Minify output CSS.
    minify: # optional, default is false
    # Tailwind config file path.
    config: # optional, default is tailwind.config.js
    # Tailwind version to use.
    tailwind-version: # optional, default is latest
    # Tailwind platform override.
    platform: # optional, default is auto
    # Explicit path to a local Tailwind binary.
    bin-path: # optional, default is 
    # Expected SHA-256 checksum for the binary.
    checksum: # optional, default is 
    # Skip checksum verification.
    insecure-skip-checksum-verification: # optional, default is false
    # PHP version used to run the action.
    php-version: # optional, default is 8.2
    # Working directory for the Tailwind command.
    working-directory: # optional, default is .
